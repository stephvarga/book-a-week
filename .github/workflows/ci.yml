name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm exec tsc --noEmit

      - run: pnpm run build
        env:
          # Placeholder values so the build step (which reads these at
          # request-time, not build-time, but next build still spins up a
          # server to prerender pages) doesn't hit the "Server misconfiguration"
          # guard. Never real secrets — this job doesn't send email or deploy.
          SITE_PASSWORD: ci-placeholder
          OWNER_EMAIL: ci@example.com
          RESEND_API_KEY: re_ci_placeholder
